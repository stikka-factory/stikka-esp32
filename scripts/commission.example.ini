; Example input for scripts/commission.py --config <file> [--profile <section>]
;
; Every key is an AT setting name (see AT+help on the node). Values are taken
; literally: no inline comments (a ";" after a value would become part of it),
; and quotes are optional. Keys left out are not touched on the node.
; Copy this file and delete what you don't need -- the commented-out keys show
; the other options with their firmware defaults.

; ---- Shared by every node ---------------------------------------------------
[DEFAULT]
; Wi-Fi (empty password = open network)
wifi.ssid = MyNetwork
wifi.password = s3cret

; stikka-server base URL. Its one-time pairing code is per node: the script
; prompts for it, or pass --pairing-code (or set server.code in a profile).
server.url = https://stikka.example.org
; server.code = ABC123

; Web UI login, user "admin" (empty = no password)
admin.password = changeme

; Seconds between status pushes to the server
status.interval = 30

; Serial log output after leaving config mode: enable | disable
debug = disable
; Log verbosity: error | warn | info | debug
loglevel = info
; Web UI on the node: enable | disable
webui = enable

; ---- One printer: Zebra / generic ZPL over the network ----------------------
; Use with: commission.py --config commission.example.ini --profile lobby
[lobby]
; Printer name, also the mDNS hostname
name = lobby-printer
; Free-text details shown next to the printer's name in the web app
details = Entrance, ground floor
; Coordinates only: auto (the server locates the printer from nearby Wi-Fi
; networks), LAT,LON for a fixed position, or empty for none
location = auto
; location = 47.3769,8.5417

; Printer type: zpl_network | zpl_usb_host | ql_usb_host | seiko_usb_host
; (a number 1-4 from AT+type also works)
type = zpl_network

; Network printer (zpl_network only)
target.host = 10.0.0.5
target.port = 9100

; Resolution and label size
dpi = 203
label.width = 100
; Label length in mm, 0 = endless
label.length = 150

; ZPL: printer accepts :Z64:/:B64: compressed graphics (enable | disable)
zpl.compression = disable

; ---- Brother QL over USB host ----------------------------------------------
[ql-desk]
name = desk-ql
type = ql_usb_host
dpi = 300
label.width = 62
label.length = 0
; Head width in px: 720 or 1296 (QL-1xxx)
ql.printhead = 720
; Invalidate bytes: 200, or 400 on QL-8xx
ql.invalidate = 200
; Auto cut: enable | disable
ql.autocut = enable
; Feed margin in dots
ql.feed = 35
; Right margin in dots, 0 = auto-center
ql.rightmargin = 0

; ---- Seiko SLP over USB host -----------------------------------------------
[seiko-desk]
name = desk-seiko
type = seiko_usb_host
dpi = 300
label.width = 54
label.length = 0
; Max dots per line
seiko.maxdots = 576
; Print density, 0 = 100%
seiko.density = 0
; Speed: 0 = draft, 2 = fine
seiko.speed = 2

; ---- Printer on a hardware UART (the "serial" method) ----------------------
; Not selectable via type in the stock builds, but the pins are settable:
[uart-example]
name = uart-printer
uart.tx = 17
uart.rx = 18
uart.baud = 9600
